name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m py_compile mirror.py
      - run: python -m unittest discover -s tests -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: mirror
        uses: ./
        with:
          source-user: ${{ github.repository_owner }}
          author-name: Smoke test
          author-email: smoke@example.com
          lookback-days: "365"
          log-file: smoke-log.md
      - run: echo "Mirrored ${{ steps.mirror.outputs.mirrored-contributions }} contributions across ${{ steps.mirror.outputs.mirrored-days }} days without pushing"
