name: Contribution Mirror
description: Mirrors another GitHub account's contributions onto your graph as dated commits, one per contribution. Dates only.
branding:
  icon: activity
  color: green

inputs:
  source-user:
    description: GitHub username whose contribution graph is mirrored. That account must have "Include private contributions on my profile" enabled.
    required: true
  author-name:
    description: Author name for the mirrored commits.
    required: true
  author-email:
    description: Author email for the mirrored commits. It must be an email verified on the account that owns this repository, or the commits will not count toward its graph.
    required: true
  lookback-days:
    description: How many days before today to inspect, inclusive of today. Values above 365 are fetched in calendar-year chunks.
    required: false
    default: "3"
  log-file:
    description: Path of the file that records mirrored contributions, one date per line.
    required: false
    default: "log.md"
  timezone:
    description: IANA timezone name used only for the commit timestamp, which is set to noon of the mirrored day plus one second per further contribution on that day.
    required: false
    default: "UTC"

outputs:
  mirrored-days:
    description: Number of days that received new commits in this run.
    value: ${{ steps.mirror.outputs.mirrored-days }}
  mirrored-contributions:
    description: Number of commits created in this run.
    value: ${{ steps.mirror.outputs.mirrored-contributions }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - run: pip install requests
      shell: bash
    - id: mirror
      run: python ${{ github.action_path }}/mirror.py
      shell: bash
      env:
        SOURCE_USER: ${{ inputs.source-user }}
        AUTHOR_NAME: ${{ inputs.author-name }}
        AUTHOR_EMAIL: ${{ inputs.author-email }}
        LOOKBACK_DAYS: ${{ inputs.lookback-days }}
        LOG_FILE: ${{ inputs.log-file }}
        TIMEZONE: ${{ inputs.timezone }}
